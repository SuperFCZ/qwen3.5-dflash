name = "w4-draft-swa1024"
description = "Nota W4A16 target and draft with conditional symmetric SWA-1024."

[server]
model = "nota-ai/Qwen3.5-4B-QAD-W4A16"
served_model_name = "qwen3.5-4b-qad-w4a16"
dtype = "bfloat16"
quantization = "compressed-tensors"
max_model_len = 8192
max_num_seqs = 4
max_num_batched_tokens = 16384
gpu_memory_utilization = 0.90
attention_backend = "FLASH_ATTN"
trust_remote_code = true

[server.environment]
EQC_DFLASH_QUANT_PATCH = "1"
EQC_DFLASH_SWA_WINDOW = "1024"

[speculative]
method = "dflash"
model = "nota-ai/Qwen3.5-4B-DFlash-GPTQ-W4A16"
num_speculative_tokens = 15
quantization = "compressed-tensors"

[benchmark]
prompt_file = "../prompts/benchmark.jsonl"
repetitions = 1
warmup_requests = 2
max_tokens = 128
concurrency = 1
temperature = 0.0
seed = 0
